name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted (`fun`), not `ubuntu-latest`: the org runs a $3 Actions budget with
  # `prevent_further_usage`, and once it is spent every GitHub-hosted job is refused
  # in ~3s with no logs. `actions/setup-dotnet` fetches the SDK into the runner's
  # tool cache, so the host needs no system .NET.
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # The runner account cannot create /usr/share/dotnet, and the tool cache is
      # writable and persists between runs, so the SDK downloads once.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Test
        run: dotnet test tests/Emby.Plugin.RdZurg.Tests -c Release

      - name: Package
        run: ./build.sh

      - name: Verify package
        run: python3 scripts/verify-package.py

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/Emby.Plugin.RdZurg/Emby.Plugin.RdZurg.csproj").findtext(".//Version"))')
          test "$RELEASE_TAG" = "v$VERSION"

      # Only the tag build feeds `release`, so an untagged push uploads nothing
      # to private artifact storage, which bills against the same budget.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: rd-zurg-for-emby
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rd-zurg-for-emby
          path: artifacts

      # Emby has no third-party catalog, so sponsors download the DLL from DMM's
      # /emby page. Published before the draft release so a release that never
      # reached DMM fails loudly.
      - name: Publish to DMM
        env:
          DMM_PUBLISH_TOKEN: ${{ secrets.DMM_PUBLISH_TOKEN }}
        run: python3 scripts/publish-to-dmm.py

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Rd zurg for Emby $RELEASE_TAG" --notes-file CHANGELOG.md artifacts/*/*.dll artifacts/*/*.sha256
