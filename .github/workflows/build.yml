name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Emby.Plugin.RdZurg.Tests -c Release

      - name: Package
        run: ./build.sh

      - name: Verify package
        run: python3 scripts/verify-package.py

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("src/Emby.Plugin.RdZurg/Emby.Plugin.RdZurg.csproj").findtext(".//Version"))')
          test "$RELEASE_TAG" = "v$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: rd-zurg-for-emby
          path: artifacts/
